<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三年級數學大冒險 - 除法探索樂園</title>
    
    <!-- 引入 Tailwind CSS 進行排版與設計 -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 引入 React 與 ReactDOM (使用 CDN) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- 引入 Babel 讓瀏覽器可以直接讀懂 JSX 語法 -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gradient-to-b from-sky-200 to-indigo-300 min-h-screen">
    
    <!-- 遊戲會被渲染在這個 div 裡面 -->
    <div id="root"></div>

    <!-- 遊戲主要邏輯 -->
    <script type="text/babel">
const { useState, useEffect } = React;

// --- 共用元件 ---
const Button = ({ onClick, children, className = '', disabled = false, variant = 'primary' }) => {
  const baseStyle = "font-bold rounded-full transition-transform transform hover:scale-105 active:scale-95 shadow-md flex items-center justify-center gap-2 cursor-pointer";
  const variants = {
    primary: "bg-blue-500 text-white hover:bg-blue-600 px-6 py-3 text-lg",
    success: "bg-green-500 text-white hover:bg-green-600 px-6 py-3 text-lg",
    warning: "bg-yellow-400 text-yellow-900 hover:bg-yellow-500 px-6 py-3 text-lg",
    secondary: "bg-purple-500 text-white hover:bg-purple-600 px-6 py-3 text-lg",
    menu: "bg-white text-gray-800 hover:bg-gray-50 border-4 px-8 py-6 text-2xl w-full max-w-md",
  };
  
  return (
    <button 
      onClick={onClick} 
      disabled={disabled}
      className={`${baseStyle} ${variants[variant]} ${disabled ? 'opacity-50 cursor-not-allowed transform-none hover:transform-none' : ''} ${className}`}
    >
      {children}
    </button>
  );
};

const Feedback = ({ type, message }) => {
  if (!message) return null;
  return (
    <div className={`mt-4 p-4 rounded-xl flex items-center gap-3 text-lg font-bold animate-bounce ${type === 'success' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`}>
      {type === 'success' ? <span className="text-3xl">✅</span> : <span className="text-3xl">❌</span>}
      {message}
    </div>
  );
};

// --- 物品圖庫 ---
const ITEMS = [
  { emoji: '🍎', name: '蘋果', unit: '顆' },
  { emoji: '🍬', name: '糖果', unit: '顆' },
  { emoji: '🍩', name: '甜甜圈', unit: '個' },
  { emoji: '⚽', name: '足球', unit: '顆' },
  { emoji: '🧸', name: '玩具熊', unit: '隻' },
  { emoji: '🍪', name: '餅乾', unit: '片' },
  { emoji: '🍓', name: '草莓', unit: '顆' },
  { emoji: '🚗', name: '小汽車', unit: '臺' }
];

// --- 可愛動物角色 ---
const CHARACTERS = ['🐶', '🐱', '🐰', '🐻', '🐼', '🦊', '🐸', '🐨'];

// --- 模式 1: 分裝任務 ---
const Mode1 = ({ onBack }) => {
  const [isPractice, setIsPractice] = useState(true);
  const [qCount, setQCount] = useState(0);

  const generateQuestion = (count) => {
    let tItems, pBox;
    if (count === 0) {
      tItems = Math.floor(Math.random() * 4) + 6; 
      pBox = Math.floor(Math.random() * 2) + 2; 
    } else {
      tItems = Math.floor(Math.random() * 15) + 10; 
      pBox = Math.floor(Math.random() * 4) + 3; 
    }
    const itemType = ITEMS[Math.floor(Math.random() * ITEMS.length)];
    return { totalItems: tItems, perBox: pBox, boxCount: Math.ceil(tItems / pBox), item: itemType };
  };

  const [qData, setQData] = useState(() => generateQuestion(0));
  const [items, setItems] = useState([]);
  
  const [feedback, setFeedback] = useState(null);
  const [step, setStep] = useState('drag');
  const [ansQ, setAnsQ] = useState('');
  const [ansR, setAnsR] = useState('');
  const [isCompleted, setIsCompleted] = useState(false);

  useEffect(() => {
    setItems(Array.from({ length: qData.totalItems }).map((_, i) => ({ id: i, loc: 'pool' })));
    setStep('drag');
    setAnsQ('');
    setAnsR('');
    setIsCompleted(false);
    setFeedback(null);
  }, [qData]);

  const handleNextQuestion = () => {
    const nextCount = qCount + 1;
    setQCount(nextCount);
    setQData(generateQuestion(nextCount));
  };

  const handleDragStart = (e, id) => {
    if (step !== 'drag') return;
    e.dataTransfer.setData('itemId', id);
  };

  const handleDrop = (e, targetLoc) => {
    e.preventDefault();
    if (step !== 'drag') return;
    const itemId = parseInt(e.dataTransfer.getData('itemId'), 10);
    
    if (targetLoc.startsWith('box-')) {
      const targetIdx = parseInt(targetLoc.split('-')[1], 10);
      
      let firstNotFullIdx = 0;
      for (let i = 0; i < qData.boxCount; i++) {
        const count = items.filter(item => item.loc === `box-${i}`).length;
        if (count < qData.perBox) {
          firstNotFullIdx = i;
          break;
        }
      }

      if (targetIdx > firstNotFullIdx) {
        setFeedback({ type: 'error', message: '上一盒尚未裝完！請依序裝盒。' });
        setTimeout(() => setFeedback(null), 2500);
        return;
      }

      const currentInBox = items.filter(item => item.loc === targetLoc).length;
      if (currentInBox >= qData.perBox) {
        setFeedback({ type: 'error', message: `這個盒子已經滿囉！(最多裝${qData.perBox}${qData.item.unit})` });
        setTimeout(() => setFeedback(null), 2000);
        return;
      }
    }
    
    setItems(prev => prev.map(item => item.id === itemId ? { ...item, loc: targetLoc } : item));
    setFeedback(null);
  };

  const checkDragComplete = () => {
    const poolCount = items.filter(i => i.loc === 'pool').length;
    const filledBoxes = items.reduce((acc, item) => {
      if (item.loc !== 'pool') acc[item.loc] = (acc[item.loc] || 0) + 1;
      return acc;
    }, {});
    
    if (poolCount >= qData.perBox) {
        setFeedback({ type: 'error', message: `還有${qData.item.name}可以湊滿一盒喔！` });
        return;
    }

    let anyIncompleteBoxButHasPool = false;
    for (const boxId in filledBoxes) {
      if (filledBoxes[boxId] > 0 && filledBoxes[boxId] < qData.perBox && poolCount > 0) {
          anyIncompleteBoxButHasPool = true;
      }
    }

    if (anyIncompleteBoxButHasPool) {
      setFeedback({ type: 'error', message: `請確定${qData.item.name}都有好好的「每 ${qData.perBox} ${qData.item.unit}裝滿一盒」喔！` });
    } else {
      setFeedback({ type: 'success', message: '分裝完成！請看著上面的盒子與剩下的物品填寫算式。' });
      setStep('math');
    }
  };

  const checkMath = () => {
    const correctQuotient = Math.floor(qData.totalItems / qData.perBox);
    const correctRemainder = qData.totalItems % qData.perBox;

    if (parseInt(ansQ) === correctQuotient && parseInt(ansR) === correctRemainder) {
      setFeedback({ type: 'success', message: `太棒了！${qData.totalItems} ÷ ${qData.perBox} = ${correctQuotient} ... ${correctRemainder}` });
      setIsCompleted(true);
    } else {
      setFeedback({ type: 'error', message: `算式不太對喔，數數看裝滿了幾盒？剩下幾${qData.item.unit}？` });
    }
  };

  const filledBoxCount = Array.from({ length: qData.boxCount }).filter((_, idx) => {
    return items.filter(i => i.loc === `box-${idx}`).length === qData.perBox;
  }).length;

  return (
    <div className="flex flex-col w-full max-w-5xl bg-blue-50 p-6 rounded-3xl shadow-lg border-4 border-blue-200 z-10 relative">
      <div className="flex justify-between items-center mb-4">
        <Button onClick={onBack} variant="primary" className="text-sm px-4 py-2"><span className="text-xl">🏠</span> 主選單</Button>
        <div className="flex flex-col items-center">
          <h2 className="text-2xl md:text-3xl font-extrabold text-blue-800">6-1 分裝任務</h2>
          <label className="flex items-center gap-2 mt-2 cursor-pointer bg-white px-4 py-1.5 rounded-full shadow-sm border-2 border-blue-200 transition-transform hover:scale-105 active:scale-95">
            <input type="checkbox" checked={isPractice} onChange={(e) => setIsPractice(e.target.checked)} className="w-5 h-5 accent-blue-500 cursor-pointer" />
            <span className="font-bold text-gray-700 text-sm">💡 啟用「示範練習」提示</span>
          </label>
        </div>
        <div className="w-24"></div>
      </div>

      <div className="bg-white p-4 rounded-xl shadow mb-4 text-lg font-bold text-gray-700 text-center">
        任務：有 {qData.totalItems} {qData.item.unit}{qData.item.name}，每 {qData.perBox} {qData.item.unit}裝成一盒。請將物品依序拖曳到盒子裡！
        {isPractice && step === 'drag' && <p className="text-blue-500 mt-2">💡 提示：試著把{qData.item.name}一個一個拉進下面的空盒子中，裝滿一盒就會記錄一次減法喔！</p>}
      </div>

      <div 
        className={`w-full p-6 rounded-xl border-4 border-dashed mb-6 min-h-[120px] transition-colors ${step === 'math' ? 'bg-gray-100 border-gray-300' : 'bg-red-50 border-red-200'}`}
        onDragOver={(e) => e.preventDefault()}
        onDrop={(e) => handleDrop(e, 'pool')}
      >
        <p className="font-bold text-gray-500 mb-2">桌上的{qData.item.name} (剩餘 {items.filter(i => i.loc === 'pool').length})</p>
        <div className="flex flex-wrap gap-2">
          {items.filter(i => i.loc === 'pool').map(item => (
            <div 
              key={item.id} 
              draggable={step === 'drag'} 
              onDragStart={(e) => handleDragStart(e, item.id)}
              className={`text-4xl ${step === 'drag' ? 'cursor-grab active:cursor-grabbing hover:scale-110' : 'opacity-70'} transition-transform`}
            >
              {qData.item.emoji}
            </div>
          ))}
        </div>
      </div>

      <div className="flex flex-col lg:flex-row justify-center items-start gap-8 lg:gap-12 mb-6 w-full">
        <div className="flex flex-wrap justify-center gap-6 max-w-2xl">
          {Array.from({ length: qData.boxCount }).map((_, boxIdx) => {
            const boxId = `box-${boxIdx}`;
            const boxItems = items.filter(i => i.loc === boxId);
            return (
              <div 
                key={boxId}
                className={`w-32 h-32 rounded-xl flex flex-col items-center justify-center p-2 border-4 transition-colors ${boxItems.length === qData.perBox ? 'bg-green-100 border-green-400' : 'bg-yellow-50 border-yellow-400 border-dashed'}`}
                onDragOver={(e) => e.preventDefault()}
                onDrop={(e) => handleDrop(e, boxId)}
              >
                <span className="text-sm font-bold text-gray-500 mb-1">{boxItems.length}/{qData.perBox}</span>
                <div className="flex flex-wrap justify-center gap-1 w-full h-full content-start">
                  {boxItems.map(item => (
                    <div 
                      key={item.id} 
                      draggable={step === 'drag'} 
                      onDragStart={(e) => handleDragStart(e, item.id)}
                      className={`text-2xl ${step === 'drag' ? 'cursor-grab active:cursor-grabbing' : ''}`}
                    >
                      {qData.item.emoji}
                    </div>
                  ))}
                </div>
              </div>
            );
          })}
        </div>

        {isPractice && step === 'drag' && filledBoxCount > 0 && (
          <div className="bg-sky-50 border-4 border-sky-300 p-6 rounded-3xl text-2xl font-mono shadow-xl min-w-[290px] animate-in fade-in slide-in-from-right duration-500">
             <div className="font-extrabold text-sky-800 mb-4 border-b-4 border-sky-200 pb-3 text-center flex items-center justify-center gap-2">
                <span>🐱</span> 分裝連減紀錄
             </div>
             {Array.from({ length: filledBoxCount }).map((_, i) => {
                const prevRem = qData.totalItems - (i * qData.perBox);
                const nextRem = qData.totalItems - ((i + 1) * qData.perBox);
                const circledNumbers = ['①', '②', '③', '④', '⑤', '⑥', '⑦', '⑧'];
                return (
                  <div key={i} className="text-gray-700 mb-3 tracking-wider flex items-center justify-between font-bold text-xl">
                    <span className="w-10 text-right text-2xl">{prevRem}</span>
                    <span className="text-gray-400 font-normal">-</span>
                    <span className="text-sky-600 font-extrabold text-2xl flex items-center">
                      {qData.perBox}<sup className="text-sky-500 text-sm ml-0.5">{circledNumbers[i] || (i + 1)}</sup>
                    </span>
                    <span className="text-gray-400 font-normal">=</span>
                    <span className="w-10 text-left text-2xl text-red-500">{nextRem}</span>
                  </div>
                );
             })}
          </div>
        )}
      </div>
      
      {step === 'drag' && (
        <div className="flex justify-center">
          <Button onClick={checkDragComplete} variant="warning" className="text-xl px-10">分裝好了！</Button>
        </div>
      )}

      {step === 'math' && (
        <div className="bg-white p-8 rounded-2xl shadow flex flex-col items-center mt-4 border-4 border-green-200 animate-in slide-in-from-bottom duration-500">
          <h3 className="text-2xl font-bold mb-6 text-gray-800">依據你的分裝結果，填寫算式：</h3>
          <div className="flex items-end gap-4 text-3xl font-bold text-gray-700 flex-wrap justify-center">
            <span className="mb-8">{qData.totalItems}</span> <span className="mb-8">÷</span> <span className="mb-8">{qData.perBox}</span> <span className="mb-8">=</span>
            
            <div className="flex flex-col items-center">
              <input type="number" disabled={isCompleted} value={ansQ} onChange={e => setAnsQ(e.target.value)} className="w-20 h-16 text-center border-4 border-gray-300 rounded-lg focus:border-blue-500 disabled:bg-gray-100 disabled:text-blue-600 mb-2 text-3xl" placeholder="商"/>
              <span className="text-sm text-blue-600 font-bold">(商)分裝成幾盒</span>
            </div>

            <span className="mb-8">...</span>

            <div className="flex flex-col items-center">
              <input type="number" disabled={isCompleted} value={ansR} onChange={e => setAnsR(e.target.value)} className="w-20 h-16 text-center border-4 border-gray-300 rounded-lg focus:border-blue-500 disabled:bg-gray-100 disabled:text-red-600 mb-2 text-3xl" placeholder="餘數"/>
              <span className="text-sm text-red-500 font-bold">(餘數)剩下幾{qData.item.unit}</span>
            </div>
          </div>
          
          {!isCompleted && <Button onClick={checkMath} variant="success" className="mt-8">送出答案</Button>}
        </div>
      )}

      {feedback && <Feedback type={feedback.type} message={feedback.message} />}

      {isCompleted && (
        <div className="flex justify-center mt-6 animate-bounce">
          <Button onClick={handleNextQuestion} variant="primary" className="px-12 py-4 text-2xl bg-indigo-500 hover:bg-indigo-600">下一題 ➔</Button>
        </div>
      )}
    </div>
  );
};

// --- 模式 2: 平分派對 ---
const Mode2 = ({ onBack }) => {
  const [isPractice, setIsPractice] = useState(true);
  const [qCount, setQCount] = useState(0);

  const generateQuestion = (count) => {
    let tItems, kids;
    if (count === 0) {
      tItems = Math.floor(Math.random() * 4) + 6;
      kids = Math.floor(Math.random() * 2) + 2; 
    } else {
      tItems = Math.floor(Math.random() * 15) + 10; 
      kids = Math.floor(Math.random() * 4) + 3; 
    }
    const itemType = ITEMS[Math.floor(Math.random() * ITEMS.length)];
    return { totalItems: tItems, numKids: kids, item: itemType };
  };

  const [qData, setQData] = useState(() => generateQuestion(0));
  const [items, setItems] = useState([]);
  
  const [feedback, setFeedback] = useState(null);
  const [step, setStep] = useState('drag');
  const [ansQ, setAnsQ] = useState('');
  const [ansR, setAnsR] = useState('');
  const [isCompleted, setIsCompleted] = useState(false);

  useEffect(() => {
    setItems(Array.from({ length: qData.totalItems }).map((_, i) => ({ id: i, loc: 'pool' })));
    setStep('drag');
    setAnsQ('');
    setAnsR('');
    setIsCompleted(false);
    setFeedback(null);
  }, [qData]);

  const handleNextQuestion = () => {
    const nextCount = qCount + 1;
    setQCount(nextCount);
    setQData(generateQuestion(nextCount));
  };

  const handleDragStart = (e, id) => {
    if (step !== 'drag') return;
    e.dataTransfer.setData('itemId', id);
  };

  const handleDrop = (e, targetLoc) => {
    e.preventDefault();
    if (step !== 'drag') return;
    const itemId = parseInt(e.dataTransfer.getData('itemId'), 10);
    
    if (targetLoc.startsWith('kid-')) {
      const targetIdx = parseInt(targetLoc.split('-')[1], 10);
      const kidsCounts = Array.from({ length: qData.numKids }).map((_, idx) => items.filter(i => i.loc === `kid-${idx}`).length);
      const currentMin = Math.min(...kidsCounts);
      const targetCount = kidsCounts[targetIdx];

      if (targetCount > currentMin) {
        setFeedback({ type: 'error', message: `要公平喔！請先發給其他還沒拿到第 ${targetCount + 1} 輪${qData.item.name}的小朋友。` });
        setTimeout(() => setFeedback(null), 2500);
        return;
      }
    }

    setItems(prev => prev.map(item => item.id === itemId ? { ...item, loc: targetLoc } : item));
    setFeedback(null);
  };

  const checkDragComplete = () => {
    const poolCount = items.filter(i => i.loc === 'pool').length;
    const kidsCounts = Array.from({ length: qData.numKids }).map((_, idx) => items.filter(i => i.loc === `kid-${idx}`).length);
    
    const maxKidHas = Math.max(...kidsCounts);
    const minKidHas = Math.min(...kidsCounts);

    if (maxKidHas !== minKidHas) {
      setFeedback({ type: 'error', message: '物品沒有平分喔！有人拿比較多。' });
      return;
    }
    
    if (poolCount >= qData.numKids) {
      setFeedback({ type: 'error', message: '桌上還有物品可以繼續平分給大家喔！' });
      return;
    }

    setFeedback({ type: 'success', message: '平分完成！請看著畫面記錄算式。' });
    setStep('math');
  };

  const checkMath = () => {
    const correctQ = Math.floor(qData.totalItems / qData.numKids);
    const correctR = qData.totalItems % qData.numKids;

    if (parseInt(ansQ) === correctQ && parseInt(ansR) === correctR) {
      setFeedback({ type: 'success', message: `答對了！${qData.totalItems} ÷ ${qData.numKids} = ${correctQ} ... ${correctR}` });
      setIsCompleted(true);
    } else {
      setFeedback({ type: 'error', message: `算式不太對喔，看看每個人拿了幾${qData.item.unit}，剩下幾${qData.item.unit}？` });
    }
  };

  const kidsCounts = Array.from({ length: qData.numKids }).map((_, idx) => items.filter(i => i.loc === `kid-${idx}`).length);
  const roundsCompleted = Math.min(...kidsCounts);
  
  const expectedQ = Math.floor(qData.totalItems / qData.numKids);
  const expectedR = qData.totalItems % qData.numKids;

  return (
    <div className="flex flex-col w-full max-w-5xl bg-green-50 p-6 rounded-3xl shadow-lg border-4 border-green-200 z-10 relative">
      <div className="flex justify-between items-center mb-4">
        <Button onClick={onBack} variant="primary" className="text-sm px-4 py-2"><span className="text-xl">🏠</span> 主選單</Button>
        <div className="flex flex-col items-center">
          <h2 className="text-2xl md:text-3xl font-extrabold text-green-800">6-2 平分派對</h2>
          <label className="flex items-center gap-2 mt-2 cursor-pointer bg-white px-4 py-1.5 rounded-full shadow-sm border-2 border-green-200 transition-transform hover:scale-105 active:scale-95">
            <input type="checkbox" checked={isPractice} onChange={(e) => setIsPractice(e.target.checked)} className="w-5 h-5 accent-green-500 cursor-pointer" />
            <span className="font-bold text-gray-700 text-sm">💡 啟用「示範練習」提示</span>
          </label>
        </div>
        <div className="w-24"></div>
      </div>

      <div className="bg-white p-4 rounded-xl shadow mb-4 text-lg font-bold text-gray-700 text-center">
        任務：有 {qData.totalItems} {qData.item.unit}{qData.item.name}，要平分給 {qData.numKids} 隻小動物，請發給牠們！
        {isPractice && step === 'drag' && <p className="text-green-600 mt-2">💡 提示：一次發一個，大家都拿到後才能發下一輪。</p>}
      </div>

      <div 
        className={`w-full p-6 rounded-xl border-4 border-dashed mb-6 min-h-[100px] transition-colors ${step === 'math' ? 'bg-gray-100 border-gray-300' : 'bg-pink-50 border-pink-200'}`}
        onDragOver={(e) => e.preventDefault()}
        onDrop={(e) => handleDrop(e, 'pool')}
      >
        <div className="flex flex-wrap gap-2 justify-center">
          {items.filter(i => i.loc === 'pool').map(item => (
            <div key={item.id} draggable={step === 'drag'} onDragStart={(e) => handleDragStart(e, item.id)} className={`text-4xl ${step === 'drag' ? 'cursor-grab hover:scale-110' : 'opacity-70'}`}>{qData.item.emoji}</div>
          ))}
        </div>
      </div>

      <div className="flex flex-col lg:flex-row justify-center items-start gap-8 lg:gap-12 mb-6 w-full">
        <div className="flex flex-wrap justify-center gap-8 max-w-2xl">
          {Array.from({ length: qData.numKids }).map((_, idx) => {
            const kidId = `kid-${idx}`;
            const kidItems = items.filter(i => i.loc === kidId);
            const kidChar = CHARACTERS[idx % CHARACTERS.length];
            return (
              <div 
                key={kidId}
                className={`flex flex-col items-center bg-white p-4 rounded-2xl border-4 min-w-[120px] min-h-[150px] transition-colors ${kidItems.length < roundsCompleted + 1 && step === 'drag' ? 'border-yellow-400 bg-yellow-50' : 'border-blue-200'}`}
                onDragOver={(e) => e.preventDefault()}
                onDrop={(e) => handleDrop(e, kidId)}
              >
                <span className="text-6xl mb-2 hover:scale-110 transition-transform">{kidChar}</span>
                <p className="font-bold text-gray-500 mb-2 border-b-2 pb-1 w-full text-center">拿到 {kidItems.length} {qData.item.unit}</p>
                <div className="flex flex-wrap justify-center gap-1 w-full">
                  {kidItems.map(item => (
                    <div key={item.id} draggable={step === 'drag'} onDragStart={(e) => handleDragStart(e, item.id)} className={`text-2xl ${step === 'drag' ? 'cursor-grab' : ''}`}>{qData.item.emoji}</div>
                  ))}
                </div>
              </div>
            );
          })}
        </div>

        {isPractice && step === 'drag' && roundsCompleted > 0 && (
          <div className="bg-orange-50 border-4 border-orange-300 p-6 rounded-3xl text-2xl font-mono shadow-xl min-w-[280px] animate-in fade-in slide-in-from-right duration-500">
             <div className="font-extrabold text-orange-800 mb-6 border-b-4 border-orange-200 pb-3 text-center">分發紀錄</div>
             {Array.from({length: roundsCompleted}).map((_, i) => (
                <div key={i} className="text-gray-700 mb-4 tracking-widest flex items-center justify-between font-bold">
                   <span className="w-12 text-right text-3xl">{qData.totalItems - (i * qData.numKids)}</span>
                   <span className="text-gray-400 mx-2 text-2xl">-</span>
                   <span className="text-blue-600 w-8 text-center text-3xl">{qData.numKids}</span>
                   <span className="text-gray-400 mx-2 text-2xl">=</span>
                   <span className="w-12 text-left text-3xl text-red-500">{qData.totalItems - ((i+1) * qData.numKids)}</span>
                </div>
             ))}
          </div>
        )}
      </div>
      
      {step === 'drag' && (
        <div className="flex justify-center mt-6">
          <Button onClick={checkDragComplete} variant="warning" className="text-2xl px-12 py-4 shadow-lg">平分好了！</Button>
        </div>
      )}

      {step === 'math' && (
        <div className="bg-white p-6 md:p-8 rounded-3xl shadow-xl flex flex-col items-center mt-4 border-4 border-green-200 animate-in slide-in-from-bottom duration-500 w-full">
          <h3 className="text-2xl font-bold mb-8 text-gray-800">根據平分結果，完成算式：</h3>
          
          <div className="flex items-start justify-center gap-2 md:gap-4 text-3xl md:text-4xl font-bold text-gray-700 flex-wrap">
            
            <div className="flex flex-col items-center gap-2">
              <span className="h-16 flex items-center justify-center">{qData.totalItems}</span>
              {isPractice && (
                <div className="text-center bg-white p-3 rounded-xl shadow-sm border-2 border-gray-200 w-28 md:w-32 text-xs md:text-sm mt-2">
                  <span className="block font-bold text-gray-800 text-lg">{qData.totalItems}</span>
                  <span className="text-gray-500">{qData.totalItems}{qData.item.unit}{qData.item.name}</span>
                </div>
              )}
            </div>

            <span className="h-16 flex items-center justify-center text-gray-400">÷</span>

            <div className="flex flex-col items-center gap-2">
              <span className="h-16 flex items-center justify-center">{qData.numKids}</span>
              {isPractice && (
                <div className="text-center bg-white p-3 rounded-xl shadow-sm border-2 border-gray-200 w-32 md:w-40 text-xs md:text-sm mt-2">
                  <span className="block font-bold text-gray-800 text-lg">{qData.numKids}</span>
                  <span className="text-gray-500">平分給{qData.numKids}個人，<br/>每次分掉{qData.numKids}{qData.item.unit}</span>
                </div>
              )}
            </div>

            <span className="h-16 flex items-center justify-center text-gray-400">=</span>

            <div className="flex flex-col items-center gap-2">
              <input type="number" disabled={isCompleted} value={ansQ} onChange={e => setAnsQ(e.target.value)} className="w-20 h-16 text-center text-3xl border-4 border-gray-300 rounded-lg focus:border-purple-500 disabled:bg-purple-50 disabled:border-purple-300 disabled:text-purple-700 transition-colors" placeholder="商"/>
              <span className="text-sm text-purple-600 font-bold">(商)每人分到</span>
              {isPractice && (
                <div className="text-center bg-white p-3 rounded-xl shadow-sm border-2 border-purple-200 w-32 md:w-40 text-xs md:text-sm mt-2">
                  <span className="block font-bold text-purple-600 text-lg">{isCompleted ? expectedQ : '?'}</span>
                  <span className="text-purple-500">分了{isCompleted ? expectedQ : '?'}次，<br/>每個人分到{isCompleted ? expectedQ : '?'}{qData.item.unit}</span>
                </div>
              )}
            </div>

            <span className="h-16 flex items-center justify-center text-gray-400">...</span>

            <div className="flex flex-col items-center gap-2">
              <input type="number" disabled={isCompleted} value={ansR} onChange={e => setAnsR(e.target.value)} className="w-20 h-16 text-center text-3xl border-4 border-gray-300 rounded-lg focus:border-red-400 disabled:bg-red-50 disabled:border-red-300 disabled:text-red-600 transition-colors" placeholder="餘數"/>
              <span className="text-sm text-red-500 font-bold">(餘數)剩下</span>
              {isPractice && (
                <div className="text-center bg-white p-3 rounded-xl shadow-sm border-2 border-red-200 w-28 md:w-32 text-xs md:text-sm mt-2">
                  <span className="block font-bold text-red-500 text-lg">{isCompleted ? expectedR : '?'}</span>
                  <span className="text-red-400">剩下{isCompleted ? expectedR : '?'}{qData.item.unit}</span>
                </div>
              )}
            </div>
          </div>

          {!isCompleted && <Button onClick={checkMath} variant="success" className="mt-10 px-12 py-4 text-xl shadow-md">送出答案</Button>}
        </div>
      )}

      {feedback && <Feedback type={feedback.type} message={feedback.message} />}

      {isCompleted && (
        <div className="flex justify-center mt-6 animate-bounce">
          <Button onClick={handleNextQuestion} variant="primary" className="px-12 py-4 text-2xl bg-indigo-500 hover:bg-indigo-600">下一題 ➔</Button>
        </div>
      )}
    </div>
  );
};

           📖 支持模式 (引導解題)
        </button>
        <button onClick={() => handleStart('quiz')} className="flex-1 bg-indigo-500 hover:bg-indigo-600 text-white font-bold py-5 rounded-2xl text-xl flex items-center justify-center gap-2 shadow-lg transition-transform hover:scale-105">
           ⚔️ 一般模式 (直接測驗)

};

const Mode3 = ({ onBack }) => {
  const [phase, setPhase] = useState('setup');
  const [config, setConfig] = useState(null);
  const [qIndex, setQIndex] = useState(1);
  const [qData, setQData] = useState(null);
  
  const [step, setStep] = useState(1); 
  const [hD1, setHD1] = useState(''); 
  const [hD2, setHD2] = useState(''); 
  
  const [vQ, setVQ] = useState('');
  const [vP, setVP] = useState('');
  const [vR, setVR] = useState('');
  const [activeInput, setActiveInput] = useState('hD1');
  const [errorInput, setErrorInput] = useState(null);
  
  const [aQ, setAQ] = useState('');
  const [aR, setAR] = useState('');

  const [feedback, setFeedback] = useState(null);
  const [isCompleted, setIsCompleted] = useState(false);
  
  const [showHelper, setShowHelper] = useState(false);
  const [helperGroups, setHelperGroups] = useState(0);

  const TEMPLATES = [
    { text: (dd, d) => `將 ${dd} 公分長的紙條，每 ${d} 公分剪成一段，最多可以剪成幾段？剩下幾公分？`, unitQ: '段', unitR: '公分', icon: '✂️' },
    { text: (dd, d) => `果農有 ${dd} 顆蘋果，每 ${d} 顆裝成一盒，最多可以裝滿幾盒？剩下幾顆？`, unitQ: '盒', unitR: '顆', icon: '🍎' },
    { text: (dd, d) => `老師買了 ${dd} 張貼紙，平分給 ${d} 個小朋友，每人最多分到幾張？剩下幾張？`, unitQ: '張', unitR: '張', icon: '⭐' },
    { text: (dd, d) => `媽媽烤了 ${dd} 片餅乾，每 ${d} 片裝成一袋，最多可以裝幾袋？剩下幾片？`, unitQ: '袋', unitR: '片', icon: '🍪' }
  ];

  const generateQuestion = (cfg) => {
    let d = Math.floor(Math.random() * 7) + 3; 
    let q = Math.floor(Math.random() * 8) + 2; 
    let r = 0;

    if (cfg.difficulty === 'remainder' || (cfg.difficulty === 'random' && Math.random() > 0.5)) {
       r = Math.floor(Math.random() * (d - 1)) + 1;
    }

    let dd = d * q + r; 
    const tpl = TEMPLATES[Math.floor(Math.random() * TEMPLATES.length)];

    return { dividend: dd, divisor: d, correctQ: q, correctR: r, template: tpl, str: tpl.text(dd, d) };
  };

  const startQuiz = (cfg) => {
    setConfig(cfg);
    setQIndex(1);
    setQData(generateQuestion(cfg));
    setPhase('playing');
    resetStep();
  };

  const resetStep = () => {
    setStep(1);
    setHD1(''); setHD2('');
    setVQ(''); setVP(''); setVR('');
    setAQ(''); setAR('');
    setActiveInput('hD1');
    setFeedback(null);
    setIsCompleted(false);
    setShowHelper(false);
    setHelperGroups(0);
  };

  const handleNextQuestion = () => {
    if (qIndex < config.qTotal) {
      setQIndex(qIndex + 1);
      setQData(generateQuestion(config));
      resetStep();
    } else {
      setPhase('end');
    }
  };

  const handleKeypadClick = (num) => {
    if (isCompleted) return;
    
    if (activeInput === 'hD1' && hD1.length < 3) setHD1(prev => prev + num);
    if (activeInput === 'hD2' && hD2.length < 2) setHD2(prev => prev + num);
    
    if (activeInput === 'vQ' && vQ.length < String(qData.correctQ).length) setVQ(prev => prev + num);
    if (activeInput === 'vP' && vP.length < String(qData.correctQ * qData.divisor).length) setVP(prev => prev + num);
    if (activeInput === 'vR' && vR.length < String(qData.correctR).length) setVR(prev => prev + num);

    if (activeInput === 'aQ' && aQ.length < 2) setAQ(prev => prev + num);
    if (activeInput === 'aR' && aR.length < 2) setAR(prev => prev + num);
  };

  const handleBackspace = () => {
    if (isCompleted) return;
    if (activeInput === 'hD1') setHD1(prev => prev.slice(0, -1));
    if (activeInput === 'hD2') setHD2(prev => prev.slice(0, -1));
    if (activeInput === 'vQ') setVQ(prev => prev.slice(0, -1));
    if (activeInput === 'vP') setVP(prev => prev.slice(0, -1));
    if (activeInput === 'vR') setVR(prev => prev.slice(0, -1));
    if (activeInput === 'aQ') setAQ(prev => prev.slice(0, -1));
    if (activeInput === 'aR') setAR(prev => prev.slice(0, -1));
  };

  const triggerError = (inputName, msg) => {
    setErrorInput(inputName);
    setTimeout(() => setErrorInput(null), 800);
    setFeedback({ type: 'error', message: msg });
  };

  const checkStep = () => {
    const isPractice = config.subMode === 'practice';

    if (step === 1) {
      if (parseInt(hD1) === qData.dividend && parseInt(hD2) === qData.divisor) {
        setStep(2);
        setActiveInput('vQ');
        setFeedback({ type: 'success', message: '列式正確！接著請完成右邊的直式計算。' });
      } else {
        triggerError(parseInt(hD1) !== qData.dividend ? 'hD1' : 'hD2', '列式不太對喔！請再讀一次題目，找出「總數」和「每份的數量」。');
      }
      return;
    }

    if (step === 2) {
      if (isPractice) {
        if (activeInput === 'vQ') {
          if (parseInt(vQ) === qData.correctQ) {
            setActiveInput('vP'); setFeedback({ type: 'success', message: '商對了！接下來請算乘積。' });
          } else triggerError('vQ', `「商」錯誤：想一想 ${qData.divisor} 乘以多少最接近 ${qData.dividend}？`);
        } else if (activeInput === 'vP') {
          if (parseInt(vP) === qData.correctQ * qData.divisor) {
            setActiveInput('vR'); setFeedback({ type: 'success', message: '乘積對了！最後請算相減的餘數。' });
          } else triggerError('vP', `「乘積」錯誤：請計算 ${qData.divisor} × ${qData.correctQ} = ?`);
        } else if (activeInput === 'vR') {
          if (parseInt(vR) === qData.correctR) {
            setStep(3); setActiveInput('aQ'); setFeedback({ type: 'success', message: '直式計算完成！請完成最後的「答」。' });
          } else triggerError('vR', `「餘數」錯誤：請相減看看。`);
        }
      } else {
        if (parseInt(vQ) !== qData.correctQ) triggerError('vQ', '商算錯囉！');
        else if (parseInt(vP) !== qData.correctQ * qData.divisor) triggerError('vP', '乘積算錯囉！');
        else if (parseInt(vR) !== qData.correctR) triggerError('vR', '餘數算錯囉！');
        else {
          setStep(3); setActiveInput('aQ'); setFeedback({ type: 'success', message: '計算正確！請把答案填入下方。' });
        }
      }
      return;
    }

    if (step === 3) {
      if (parseInt(aQ) === qData.correctQ && parseInt(aR) === qData.correctR) {
        setFeedback({ type: 'success', message: '完全正確！你太棒了！' });
        setIsCompleted(true);
        setActiveInput(null);
      } else {
        triggerError(parseInt(aQ) !== qData.correctQ ? 'aQ' : 'aR', '答案填錯囉！請對照直式算出來的「商」和「餘數」。');
      }
    }
  };

  const GridRow = ({ value, targetLength, isActive, isError, onClick }) => {
    const emptyCount = Math.max(0, 2 - targetLength);
    const chars = value.toString().split('');
    const filled = chars.concat(Array(Math.max(0, targetLength - chars.length)).fill(''));
    
    return (
      <div className={`flex cursor-pointer ${isActive ? 'z-10 relative' : ''} ${isError ? 'animate-shake' : ''}`} onClick={onClick}>
        {Array(emptyCount).fill(0).map((_, i) => (<div key={`e-${i}`} className="w-12 h-14" />))}
        {filled.map((char, i) => (
          <div key={`b-${i}`} className={`w-12 h-14 border-2 flex items-center justify-center text-3xl font-mono font-bold rounded
            ${isError ? 'border-red-500 bg-red-50 text-red-600 z-20' : isActive ? 'border-purple-500 bg-purple-50 ring-2 ring-purple-200 text-purple-800 z-20' : 'border-gray-300 bg-white'}`}
          >
            {char || '\u00A0'}
          </div>
        ))}
      </div>
    );
  };

  if (phase === 'setup') return <Mode3Setup onStart={startQuiz} onBack={onBack} />;
  if (phase === 'end') {
    return (
      <div className="flex flex-col items-center justify-center w-full max-w-lg bg-white p-12 rounded-3xl shadow-xl border-4 border-indigo-300 animate-in zoom-in duration-500 z-10 relative">
         <div className="text-6xl mb-6">🏆</div>
         <h2 className="text-4xl font-extrabold mb-4 text-indigo-700">解題大師！</h2>
         <p className="text-xl text-gray-700 mb-8 font-bold">恭喜通過 {config.qTotal} 題應用問題挑戰！</p>
         <Button onClick={() => setPhase('setup')} variant="primary" className="px-10 py-4 text-xl">再來一次</Button>
         <Button onClick={onBack} variant="menu" className="mt-4 text-lg border-2 px-8 py-3 w-auto">回主選單</Button>
      </div>
    );
  }

  const isPractice = config.subMode === 'practice';
  const showV = step >= 2;
  const showP = !isPractice || activeInput === 'vP' || activeInput === 'vR' || step >= 3;
  const showR = !isPractice || activeInput === 'vR' || step >= 3;

  return (
    <div className="flex flex-col w-full max-w-6xl bg-indigo-50 h-[85vh] rounded-2xl shadow-2xl overflow-hidden border-4 border-indigo-200 z-10 relative">
      <style>{`
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 50% { transform: translateX(6px); } 75% { transform: translateX(-6px); } }
        .animate-shake { animation: shake 0.4s ease-in-out; }
      `}</style>

      <div className="bg-white border-b-4 border-indigo-100 flex justify-between items-center p-4">
        <Button onClick={() => setPhase('setup')} variant="primary" className="text-sm px-4 py-2 !bg-gray-100 !text-gray-700 hover:!bg-gray-200"><span className="text-lg">⬅️</span> 重新設定</Button>
        <span className="font-extrabold text-indigo-800 text-xl">第 {qIndex} / {config.qTotal} 題</span>
        <Button onClick={() => setShowHelper(!showHelper)} variant="warning" className="text-sm px-4 py-2">💡 圖解小幫手</Button>
      </div>

      <div className="flex flex-1 overflow-hidden">
        
        <div className="w-5/12 bg-white border-r-4 border-indigo-100 p-6 flex flex-col relative">
           
           {showHelper && (
             <div className="absolute inset-0 bg-yellow-50 z-30 p-6 flex flex-col animate-in fade-in">
                <div className="flex justify-between items-center mb-4">
                  <h3 className="font-bold text-xl text-yellow-800">💡 圖解小幫手</h3>
                  <button onClick={() => setShowHelper(false)} className="text-gray-500 hover:text-red-500 font-bold text-xl">✕</button>
                </div>
                <div className="flex-1 overflow-y-auto bg-white rounded-xl border-2 border-yellow-200 p-4">
                  <div className="flex flex-wrap gap-2 mb-4 p-4 bg-gray-50 rounded-lg border">
                    <p className="w-full font-bold text-sm text-gray-500">還沒分裝的 ({qData.dividend - helperGroups * qData.divisor})：</p>
                    {Array.from({length: qData.dividend - helperGroups * qData.divisor}).map((_, i) => <span key={i} className="text-2xl">{qData.template.icon}</span>)}
                  </div>
                  <div className="flex flex-wrap gap-2">
                    {Array.from({length: helperGroups}).map((_, i) => (
                      <div key={i} className="p-2 border-2 border-green-400 bg-green-50 rounded-lg flex gap-1">
                        {Array.from({length: qData.divisor}).map((_, j) => <span key={j} className="text-xl">{qData.template.icon}</span>)}
                      </div>
                    ))}
                  </div>
                </div>
                <div className="mt-4 flex gap-2">
                  <Button disabled={helperGroups >= qData.correctQ} onClick={() => setHelperGroups(prev => prev+1)} variant="success" className="flex-1 py-2">✅ 分 1 組</Button>
                  <Button onClick={() => setHelperGroups(0)} variant="primary" className="py-2 !bg-gray-400">重設</Button>
                </div>
             </div>
           )}

           <div className="bg-indigo-100 p-4 rounded-xl mb-6 text-xl font-bold text-indigo-900 leading-relaxed border-2 border-indigo-200">
             {qData.template.icon} {qData.str}
           </div>

           <div className="flex flex-col flex-1 justify-end">
             <div className="grid grid-cols-3 gap-3 w-full mb-4">
               {[1, 2, 3, 4, 5, 6, 7, 8, 9, 'C', 0, '⌫'].map(num => (
                 <button 
                   key={num} 
                   onClick={() => {
                     if (num === 'C') { if(activeInput) {
                        if (activeInput.startsWith('h')) {setHD1(''); setHD2('');}
                        else if (activeInput.startsWith('v')) {setVQ(''); setVP(''); setVR('');}
                        else {setAQ(''); setAR('');}
                     } }
                     else if (num === '⌫') handleBackspace();
                     else handleKeypadClick(num.toString());
                   }}
                   className={`h-16 rounded-xl text-2xl font-bold transition-transform active:scale-95 shadow-sm
                     ${num === 'C' ? 'bg-red-100 text-red-600 border border-red-200' 
                     : num === '⌫' ? 'bg-gray-200 text-gray-700 border border-gray-300' 
                     : 'bg-white border-2 border-indigo-200 text-indigo-700 hover:bg-indigo-50'}`}
                 >
                   {num}
                 </button>
               ))}
             </div>
           </div>
        </div>

        <div className="flex-1 p-8 flex flex-col justify-start bg-slate-50 overflow-y-auto">
          
          <div className={`p-4 rounded-xl border-4 mb-6 transition-all ${step === 1 ? 'bg-white border-purple-300 shadow-md' : 'bg-gray-100 border-gray-200 opacity-60'}`}>
             <div className="font-bold text-sm text-purple-600 mb-2">步驟 1：列出橫式</div>
             <div className="flex items-center text-3xl font-bold font-mono gap-2 flex-wrap">
                <div className={`w-20 h-14 bg-white border-2 rounded-lg flex items-center justify-center cursor-pointer ${activeInput === 'hD1' && !isCompleted ? 'border-purple-500 ring-2 ring-purple-200 text-purple-700' : errorInput === 'hD1' ? 'border-red-500 animate-shake' : 'border-gray-300'}`} onClick={() => step === 1 && setActiveInput('hD1')}>
                  {hD1}
                </div>
                <span className="text-gray-500">÷</span>
                <div className={`w-16 h-14 bg-white border-2 rounded-lg flex items-center justify-center cursor-pointer ${activeInput === 'hD2' && !isCompleted ? 'border-purple-500 ring-2 ring-purple-200 text-purple-700' : errorInput === 'hD2' ? 'border-red-500 animate-shake' : 'border-gray-300'}`} onClick={() => step === 1 && setActiveInput('hD2')}>
                  {hD2}
                </div>
                <span className="text-gray-500">=</span>
                <div className="w-16 h-14 border-b-4 border-dashed border-gray-300 flex items-center justify-center text-purple-700">{step > 1 ? qData.correctQ : ''}</div>
                <span className="text-gray-500">...</span>
                <div className="w-12 h-14 border-b-4 border-dashed border-gray-300 flex items-center justify-center text-red-500">{step > 1 ? qData.correctR : ''}</div>
             </div>
          </div>

          <div className={`p-4 rounded-xl border-4 mb-6 flex flex-col items-center transition-all ${step === 2 ? 'bg-white border-purple-300 shadow-md' : !showV ? 'hidden' : 'bg-gray-100 border-gray-200 opacity-60'}`}>
             <div className="font-bold text-sm text-purple-600 w-full mb-4">步驟 2：直式計算</div>
             
             <div className="flex flex-col items-start font-mono text-3xl">
                <div className="flex ml-[80px]">
                  <div className="w-12 h-6 flex items-center justify-center text-gray-400 text-xs font-bold">十</div>
                  <div className="w-12 h-6 flex items-center justify-center text-gray-400 text-xs font-bold">個</div>
                </div>

                <div className="flex ml-[80px] mb-1">
                  <GridRow value={vQ} targetLength={String(qData.correctQ).length} isActive={activeInput === 'vQ' && step === 2} isError={errorInput === 'vQ'} onClick={() => step === 2 && setActiveInput('vQ')} />
                </div>

                <div className="flex items-stretch">
                  <div className="w-[80px] flex justify-end items-center pr-2 text-4xl font-bold text-gray-700">
                    {step >= 2 ? qData.divisor : ''} <span className="ml-2 font-light scale-y-[1.5] text-5xl">)</span>
                  </div>
                  <div className="flex border-t-4 border-black">
                    {String(step >= 2 ? qData.dividend : '  ').split('').map((char, i) => (
                      <div key={i} className="w-12 h-14 flex items-center justify-center text-3xl font-bold text-gray-800 tracking-widest">{char}</div>
                    ))}
                  </div>
                </div>

                <div className={`flex ml-[80px] mt-1 transition-opacity ${showP ? 'opacity-100' : 'opacity-0'}`}>
                  <GridRow value={vP} targetLength={String(qData.correctQ * qData.divisor).length} isActive={activeInput === 'vP' && step === 2} isError={errorInput === 'vP'} onClick={() => step === 2 && setActiveInput('vP')} />
                </div>

                <div className={`flex ml-[80px] my-1 transition-opacity ${showR ? 'opacity-100' : 'opacity-0'}`} style={{ width: '6rem' }}>
                   <div className="w-full border-t-4 border-black"></div>
                </div>

                <div className={`flex ml-[80px] mt-1 transition-opacity ${showR ? 'opacity-100' : 'opacity-0'}`}>
                  <GridRow value={vR} targetLength={String(qData.correctR).length} isActive={activeInput === 'vR' && step === 2} isError={errorInput === 'vR'} onClick={() => step === 2 && setActiveInput('vR')} />
                </div>
             </div>
          </div>

          <div className={`p-4 rounded-xl border-4 mb-4 transition-all ${step === 3 ? 'bg-white border-purple-300 shadow-md' : step < 3 ? 'hidden' : 'bg-gray-100 border-gray-200'}`}>
             <div className="font-bold text-sm text-purple-600 mb-2">步驟 3：寫出答案</div>
             <div className="flex items-center text-2xl font-bold gap-3 flex-wrap">
                <span className="text-gray-700">答：</span>
                <span className="text-gray-600">{qData.template.unitQ === '段' ? '剪成' : qData.template.unitQ === '盒' ? '裝滿' : '分到'}</span>
                <div className={`w-16 h-12 bg-white border-2 rounded-lg flex items-center justify-center cursor-pointer ${activeInput === 'aQ' && !isCompleted ? 'border-purple-500 ring-2 ring-purple-200 text-purple-700' : errorInput === 'aQ' ? 'border-red-500 animate-shake' : 'border-gray-300'}`} onClick={() => !isCompleted && setActiveInput('aQ')}>{aQ}</div>
                <span className="text-gray-600">{qData.template.unitQ}，</span>
                
                <span className="text-gray-600">剩下</span>
                <div className={`w-16 h-12 bg-white border-2 rounded-lg flex items-center justify-center cursor-pointer ${activeInput === 'aR' && !isCompleted ? 'border-purple-500 ring-2 ring-purple-200 text-purple-700' : errorInput === 'aR' ? 'border-red-500 animate-shake' : 'border-gray-300'}`} onClick={() => !isCompleted && setActiveInput('aR')}>{aR}</div>
                <span className="text-gray-600">{qData.template.unitR}。</span>
             </div>
          </div>

          <div className="mt-auto pt-4 flex flex-col items-center">
            {!isCompleted && (
              <Button onClick={checkStep} variant="success" className="px-10 py-4 text-xl shadow-md w-full max-w-sm">
                檢查目前步驟
              </Button>
            )}
            <div className="mt-2 w-full">{feedback && <Feedback type={feedback.type} message={feedback.message} />}</div>
            {isCompleted && (
              <Button onClick={handleNextQuestion} variant="primary" className="mt-4 px-12 py-4 text-xl bg-indigo-500 shadow-lg animate-bounce">
                {qIndex < config.qTotal ? '下一題 ➔' : '查看成績 🌟'}
              </Button>
            )}
          </div>
        </div>
      </div>
    </div>
  );
};

// --- 主選單 ---
function App() {
  const [currentMode, setCurrentMode] = useState('menu'); 

  return (
    <div className="min-h-screen p-6 font-sans text-gray-800 flex flex-col items-center justify-center relative">
      {currentMode === 'menu' && (
        <div className="flex flex-col items-center max-w-2xl w-full bg-white/90 backdrop-blur-md p-8 md:p-12 rounded-[3rem] shadow-2xl border-8 border-sky-300 animate-in fade-in zoom-in duration-300">
          <div className="text-6xl mb-2 animate-bounce">🎒</div>
          <h1 className="text-4xl md:text-5xl font-black text-sky-900 mb-2 text-center tracking-wide">
            三年級數學大冒險
          </h1>
          <p className="text-xl font-bold text-sky-600 mb-8 border-b-2 border-sky-100 pb-3">第六單元：除法探索樂園</p>

          <div className="flex flex-col gap-5 w-full items-center">
            <Button onClick={() => setCurrentMode('mode1')} variant="menu" className="border-blue-400 text-blue-800 hover:bg-blue-50">
              <span className="text-4xl">📦</span>
              <div className="flex flex-col items-start text-left">
                <span>6-1 分裝任務</span>
                <span className="text-sm font-normal text-gray-500">學習「包含除」概念</span>
              </div>
            </Button>

            <Button onClick={() => setCurrentMode('mode2')} variant="menu" className="border-green-400 text-green-800 hover:bg-green-50">
              <span className="text-4xl">🎉</span>
              <div className="flex flex-col items-start text-left">
                <span>6-2 平分派對</span>
                <span className="text-sm font-normal text-gray-500">學習「等分除」與分發紀錄</span>
              </div>
            </Button>

            <Button onClick={() => setCurrentMode('mode3')} variant="menu" className="border-purple-400 text-purple-800 hover:bg-purple-50">
              <span className="text-4xl">🏰</span>
              <div className="flex flex-col items-start text-left">
                <span>6-3 應用問題挑戰</span>
                <span className="text-sm font-normal text-gray-500">三步驟鷹架引導與直式計算</span>
              </div>
            </Button>
          </div>
        </div>
      )}

      {currentMode === 'mode1' && <Mode1 onBack={() => setCurrentMode('menu')} />}
      {currentMode === 'mode2' && <Mode2 onBack={() => setCurrentMode('menu')} />}
      {currentMode === 'mode3' && <Mode3 onBack={() => setCurrentMode('menu')} />}
    </div>
  );
}

// 將 App 渲染到畫面上
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
    </script>
</body>
</html>
